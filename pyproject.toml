[project]
name = "harmscope"
version = "0.1.0"
description = "Emergent consumer-harm discovery over the CFPB Consumer Complaint Database"
requires-python = ">=3.11"

# Dependencies live in requirements*.txt, which the Makefile installs.
# The heavy ML stack (torch, faiss, umap, hdbscan) is deliberately not a base
# dependency: Phase 0-1 do not need it and CI should not spend six minutes
# building it. See requirements-ml.txt.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RET", "SIM"]
ignore = [
  "S101",  # assert is how tests assert
  "E501",  # line length is ruff-formatted, not hand-policed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# This module's whole job is building `read_csv` statements. DuckDB table
# functions cannot take bind parameters, so the path is interpolated — escaped
# by `_q()`, and sourced from our own config, not from data. Every other value
# in these statements is a literal written in the module.
"src/ingestion/load.py" = ["S608"]
# Same reasoning: these compose SQL from module-literal fragments (crosswalk
# lookup expressions, the escaped CSV path). No value here comes from data.
"src/ingestion/build.py" = ["S608"]
"src/normalization/taxonomy.py" = ["S608"]
