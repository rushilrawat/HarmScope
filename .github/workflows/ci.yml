name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-ml.txt
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Phase 0 acceptance — empty schema-valid database builds from scratch
        run: python -m src.pipeline run --phase init
